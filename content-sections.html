<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intelligence Layer Test</title>
  <link rel="stylesheet" href="./assets/index.css">
  <link rel="stylesheet" href="./assets/intelligence.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body style="background-color: #ffffff; margin: 0; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Dev Controls Header -->
  <header style="width: 100%; padding: 12px 24px; display: flex; justify-content: flex-end; align-items: center; gap: 12px; border-bottom: 1px solid #f0f0f0; background-color: #fafafa; font-family: 'DM Sans', sans-serif; box-sizing: border-box;">
    <span style="color: #9ca3af; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; margin-right: 8px; line-height: 1;">Component Testing</span>
    <button id="test-theme-btn" class="test-btn" style="margin: 0; display: inline-flex; align-items: center; justify-content: center; height: 32px; background: #D10D88; color: #fff; border: 1px solid #D10D88; border-radius: 4px; font-size: 0.85rem; padding: 0 16px; transition: all 0.2s ease; cursor: pointer;">Toggle Blue Pipeline</button>
  </header>

  <main style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem;">
    <section class="opportunity-layer-section" style="width: 100%; max-width: 1000px;">
    <div class="intelligence-container" style="flex-direction: row-reverse;">
      
      <!-- Visual Graphic Column -->
      <div class="opportunity-graphic">
        
        <!-- Static Background Rings -->
        <div class="static-rings">
          <div class="static-ring" style="width: 100px; height: 100px;"></div>
          <div class="static-ring" style="width: 190px; height: 190px;"></div>
          <div class="static-ring" style="width: 280px; height: 280px;"></div>
          <div class="static-ring" style="width: 370px; height: 370px;"></div>
          <div class="static-ring" style="width: 460px; height: 460px;"></div>
        </div>
        <!-- Sonar Sweep Radar -->
        <div class="sonar-sweep"></div>
        <!-- Opportunities -->
        <div class="opp-node opp-node-hazy opp-pos-1">
          <i class="ph ph-file-text"></i>
          <span class="opp-label">Unknown RFP</span>
        </div>
        <div class="opp-node opp-node-hazy opp-pos-2">
          <i class="ph ph-file-text"></i>
          <span class="opp-label">Irrelevant</span>
        </div>
        <div class="opp-node opp-node-hazy opp-pos-3">
          <i class="ph ph-file-text"></i>
          <span class="opp-label">High Match</span>
        </div>
        <div class="opp-node opp-node-hazy opp-pos-4">
          <i class="ph ph-file-text"></i>
          <span class="opp-label">Low Match</span>
        </div>

        <!-- Central Node (PetalOS) -->
        <div class="central-sonar-node">
          <svg viewBox="0 0 66.54 66.54" width="48" height="48">

          </svg>
        </div>

      </div>

      <!-- Text Content Column -->
      <div class="intelligence-content">
        <h2 class="text-header-section" style="margin-bottom: 24px;">Finding the <span class="intel-title-gradient">Right</span> Opportunity</h2>
        <p class="text-body intel-body-text" style="color: #6b7280; font-size: 18px;">
          Stop combing through irrelevant contracts. PetalOS reduces risk around RFP opportunities by bringing additional context and clarity, making it easier to navigate the numerous opportunities you receive.
        </p>
      </div>

    </div>
  </section>
  </main>

  <script>
    const container = document.querySelector('.opportunity-layer-section');
    const themeBtn = document.getElementById('test-theme-btn');
    
    themeBtn.addEventListener('click', () => {
      container.classList.toggle('theme-blue');
      if (container.classList.contains('theme-blue')) {
        themeBtn.style.background = '#04c8c8';
        themeBtn.style.borderColor = '#04c8c8';
        themeBtn.innerText = 'Toggle Pink Pipeline';
      } else {
        themeBtn.style.background = '#D10D88';
        themeBtn.style.borderColor = '#D10D88';
        themeBtn.innerText = 'Toggle Blue Pipeline';
      }
    });
  </script>
</body>
</html>
